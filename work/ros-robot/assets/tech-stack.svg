<text x="94" y="555" font-size="22" font-weight="700">HTML5 video</text><text x="94" y="589" font-size="20" fill="#51627b">Webcam 與 ArUco 雙影片</text>
<text x="555" y="555" font-size="22" font-weight="700">JavaScript · Canvas</text><text x="555" y="589" font-size="20" fill="#51627b">CSV 解析與數據圖表</text>
<path d="M467 567H530" fill="none" stroke="#1d5fc4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="636" width="856" height="56" rx="8" fill="#edf4ff"/>
